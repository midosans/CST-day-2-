    <form id="login-form" method="GET" action="main.html">
    <fieldset>
        <legend>Login</legend>
        <label for="username"><u>U</u>sername:</label>
        <br>
        <input type="text" id="username" name="username" accesskey="u" placeholder="Enter your username" required>
        <br>
        <label for="password"><u>P</u>assword:</label>
        <br>
        <input type="password" id="password" name="password" accesskey="p" placeholder="Enter your password" required>
        <br>
        <div>
        <input type="checkbox" id="remember" name="remember" accesskey="r">
        <label for="remember"><u>R</u>emember me:</label>
        </div>
        <div class="center-align"><input type="submit" value="Login" accesskey="l" class="button"></div>
    </fieldset>
    </form>
